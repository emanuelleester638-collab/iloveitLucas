<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>I Love You ❤️</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<canvas id="heart"></canvas>

<script>
    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let scale = 11;

    function drawHeart() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff6333";
        ctx.font = "bold 8px Arial";
        ctx.textAlign = "center";

        for (let i = 0; i < 120; i++) {

            let angle = i * (Math.PI * 2) / 120;

            let x = 16 * Math.pow(Math.sin(angle), 3) * scale;

            let y = (
                13 * Math.cos(angle)
                - 5 * Math.cos(2 * angle)
                - 2 * Math.cos(3 * angle)
                - Math.cos(4 * angle)
            ) * scale;

            ctx.fillText(
                "I LOVE YOU",
                canvas.width / 2 + x,
                canvas.height / 2 - y
            );
        }

        scale += 0.02;

        if (scale > 16) {
            scale = 11;
        }

        requestAnimationFrame(drawHeart);
    }

    drawHeart();
</script>

</body>
</html>
